services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_REVERB_APP_KEY: cti-portal-key
        VITE_REVERB_HOST: cti-portal.selytheng.local
        VITE_REVERB_PORT: 443
        VITE_REVERB_SCHEME: https
    container_name: cti-portal-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_NAME: "CTI Portal"
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: https://cti-portal.selytheng.local
      FORCE_HTTPS: "true"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cti_portal
      DB_USERNAME: cti_user
      DB_PASSWORD: cti_secret_password

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: "null"
      REDIS_PORT: 6379

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: cti-portal-id
      REVERB_APP_KEY: cti-portal-key
      REVERB_APP_SECRET: cti-portal-secret
      REVERB_HOST: cti-portal.selytheng.local
      REVERB_PORT: 8080
      REVERB_SCHEME: https
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    volumes:
      - app_storage:/var/www/html/storage
      - ./docker/ssl:/etc/nginx/ssl:ro,z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cti-network

  postgres:
    image: postgres:16-alpine
    container_name: cti-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cti_portal
      POSTGRES_USER: cti_user
      POSTGRES_PASSWORD: cti_secret_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti_user -d cti_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cti-network

  redis:
    image: redis:7-alpine
    container_name: cti-portal-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cti-network

volumes:
  pg_data:
  redis_data:
  app_storage:

networks:
  cti-network:
    driver: bridge
